name: Verify SPHEREx
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements.lock
      - run: python -m pytest -q
      - run: npm ci
        working-directory: web
      - run: npm run check && npm test && npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Exercise production shell with Chromium
        run: |
          df -h .
          SPHEREX_CACHE="$RUNNER_TEMP/spherex-cache" SPHEREX_DISK_RESERVE_BYTES=0 python -m uvicorn server.app:app --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/spherex.log" 2>&1 &
          trap 'kill "$!"' EXIT
          curl --fail --retry 7 --retry-connrefused --retry-delay 1 http://127.0.0.1:4173/readyz
          if ! node web/scripts/browser-smoke.mjs || ! node web/scripts/browser-time-network.mjs; then
            cat "$RUNNER_TEMP/spherex.log"
            exit 1
          fi
      - name: Package build and provenance
        run: |
          printf 'SPHEREX_RELEASE=%s\n' "$GITHUB_SHA" > release.env
          sha256sum requirements.lock web/package-lock.json > dependency-hashes.sha256
          tar --exclude='__pycache__' -czf "spherex-$GITHUB_SHA.tar.gz" server presets web/dist requirements.lock release.env dependency-hashes.sha256 deploy
      - uses: actions/upload-artifact@v4
        with:
          name: spherex-${{ github.sha }}
          path: spherex-${{ github.sha }}.tar.gz
